<h2>{{ 'changelog.title' | transloco }}</h2>

@if (!isOnline()) {
  <p>{{ 'changelog.offline' | transloco }}</p>
} @else {
  @if (isLoading()) {
    <div class="flex justify-center items-center h-full">
      <p-progress-spinner ariaLabel="loading" />
    </div>
  } @else {
    @if (changelogs().length > 0) {
      <div>
        @for (changelog of changelogs(); track $index) {
          <div class="mb-4">
            <p-panel
              header="{{ changelog.name }} - {{ changelog.published_at | date: 'dd/MM/yyyy HH:mm' }}"
              [toggleable]="true"
              [collapsed]="true"
            >
              <markdown class="markdown" ngPreserveWhitespaces>
                {{ changelog.body }}
              </markdown>
            </p-panel>
          </div>
        }
      </div>
    } @else {
      <p>{{ 'changelog.empty' | transloco }}</p>
    }
  }
}
