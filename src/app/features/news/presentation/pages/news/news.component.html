<h2>{{ 'home.news-title' | transloco }}</h2>

@if (!isOnline()) {
  <p>{{ 'news.offline' | transloco }}</p>
} @else {
  @if (isLoading()) {
    <div class="flex justify-center items-center h-full">
      <p-progress-spinner ariaLabel="loading" />
    </div>
  } @else {
    @if (news().length > 0) {
      <markdown ngPreserveWhitespaces>{{ news() }}</markdown>
    } @else {
      <p>{{ 'news.empty' | transloco }}</p>
    }
  }
}
