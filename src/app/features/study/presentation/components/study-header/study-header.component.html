<app-export-dialog></app-export-dialog>
<section class="study-header">
  <h1 class="study-header__title" data-testid="study-title">{{ study()?.title }}</h1>

  <button
    (click)="openModifyStudyModal.emit()"
    app-btn
    btnSize="s"
    btnStyle="text"
    [attr.aria-label]="'study.header.aria-modify' | transloco"
    data-testid="modify-btn"
  >
    <app-icon icon="edit" />
  </button>

  <hr class="study-header__separator" />

  <button
    app-btn
    btnSize="s"
    btnStyle="text"
    (click)="toggleActiveDetail()"
    class="study-header__accodion-btn"
    [class.study-header__accodion-btn--open]="isDetailOpen()"
    data-testid="details-toggle"
  >
    {{ 'study.header.details' | transloco }}
    <app-icon icon="keyboard_arrow_down" iconRight />
  </button>

  <hr class="study-header__separator" />

  <p class="study-header__author">
    <app-icon icon="person" />
    {{ study()?.author_email }}
  </p>

  <time [attr.datetime]="study()?.created_at_offline" class="study-header__time">
    <app-icon icon="schedule" />
    {{ study()?.created_at_offline | date: dateFormat() }}
  </time>
  @if (study()?.shareable) {
    <hr class="study-header__separator" />

    <app-tag text="Shared" type="error" />
  }

  <hr class="study-header__separator" />

  <button app-btn btnSize="s" btnStyle="text" (click)="duplicateStudy.emit(study()?.uuid!)" data-testid="duplicate-btn">
    <app-icon icon="content_copy" />
    <ng-container>{{ 'study.header.duplicate' | transloco }}</ng-container>
  </button>

  <button app-btn btnSize="s" disabled btnStyle="text">
    <app-icon icon="public" />
    <ng-container>{{ 'study.header.publish' | transloco }}</ng-container>
  </button>

  <button app-btn btnSize="s" btnStyle="text" (click)="openExportDialog()" data-testid="export-btn">
    <app-icon icon="download" />
    <ng-container>{{ 'study.header.export' | transloco }}</ng-container>
  </button>

  <p-accordion
    [(value)]="activeDetail"
    class="study-header__accordion"
    [class.study-header__accordion--open]="isDetailOpen()"
  >
    <p-accordion-panel value="0">
      <p-accordion-content>
        <div class="study-header__accordion__content">
          <app-icon icon="description" />
          <p>
            {{ study()?.description }}
            @if (study() && !study()!.description) {
              <em>{{ 'study.header.no-description' | transloco }}</em>
            }
          </p>
        </div>
      </p-accordion-content>
    </p-accordion-panel>
  </p-accordion>
</section>
