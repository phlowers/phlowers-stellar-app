<p id="mandatory-data-field" class="field-datas__mandatory-msg">
  <app-icon icon="info" />
  <span>{{ 'field-measuring.field-datas.mandatory-msg' | transloco }}</span>
</p>

<div class="field-datas__grid">
  <div class="name">
    <label for="measureName">{{ 'field-measuring.field-datas.name-label' | transloco }}</label>
    <input
      pInputText
      id="measureName"
      type="text"
      [fluid]="true"
      [attr.aria-invalid]="isNameAlreadyTaken()"
      [attr.aria-errormessage]="isNameAlreadyTaken() ? 'measure-name-error-message' : null"
      [ngModel]="measureData().name"
      (ngModelChange)="onFieldChange('name', $event)"
      aria-describedby="mandatory-data-field"
      required
      [class.ng-invalid]="isNameAlreadyTaken()"
      data-testid="measure-name-input"
    />
    @if (isNameAlreadyTaken()) {
      <p-message id="measure-name-error-message" severity="error" size="small" variant="simple">{{
        'field-measuring.shared.measure-name-unique-error' | transloco
      }}</p-message>
    }
  </div>

  <div class="date">
    <label for="date">{{ 'field-measuring.field-datas.date-label' | transloco }}</label>
    <p-datepicker
      appendTo="body"
      id="date"
      [ngModel]="measureData().date"
      (ngModelChange)="onFieldChange('date', $event)"
      dateFormat="dd/mm/yy"
      styleClass="w-full"
      [showIcon]="true"
      ariaDescribedBy="mandatory-data-field"
      [required]="true"
      data-testid="date-picker"
    />
  </div>

  <div class="time">
    <div class="time__label">
      <label for="time" id="timeLabel">{{ 'field-measuring.field-datas.time-label' | transloco }}</label>
      <p-selectbutton
        [options]="timeModeOptions()"
        [ngModel]="measureData().season"
        (onChange)="onFieldChange('season', $event.value)"
        optionLabel="label"
        optionValue="value"
        allowEmpty="false"
        ariaLabelledBy="timeLabel"
        data-testid="time-mode-selector"
      />
    </div>

    <p-datepicker
      appendTo="body"
      id="time"
      [ngModel]="measureData().time"
      (ngModelChange)="onFieldChange('time', $event)"
      [timeOnly]="true"
      hourFormat="24"
      styleClass="w-full"
      [showIcon]="true"
      ariaDescribedBy="mandatory-data-field"
      [required]="true"
      data-testid="time-picker"
    />
  </div>

  <div class="temperature">
    <label for="ambientTemperature">{{ 'field-measuring.field-datas.ambient-temperature-label' | transloco }}</label>
    <p-inputgroup>
      <input
        pInputText
        id="ambientTemperature"
        type="number"
        [min]="-50"
        [max]="99"
        [ngModel]="measureData().ambientTemperature"
        (ngModelChange)="onFieldChange('ambientTemperature', $event)"
        aria-describedby="mandatory-data-field"
        required
        data-testid="ambient-temperature-input"
      />
      <p-inputgroup-addon>°C</p-inputgroup-addon>
    </p-inputgroup>
  </div>

  <div class="wind">
    <div class="wind__label">
      <label for="windSpeed" id="wind">{{ 'field-measuring.shared.wind-speed-label' | transloco }}</label>
      <p-selectbutton
        [options]="windSpeedUnitOptions"
        [ngModel]="measureData().windSpeedUnit"
        (onChange)="onFieldChange('windSpeedUnit', $event.value)"
        optionLabel="label"
        optionValue="value"
        allowEmpty="false"
        ariaLabelledBy="wind"
        data-testid="wind-speed-unit-selector"
      />
    </div>

    <input
      pInputText
      id="windSpeed"
      type="number"
      [fluid]="true"
      [min]="0"
      [max]="50"
      [ngModel]="measureData().windSpeed"
      (ngModelChange)="onFieldChange('windSpeed', $event)"
      aria-describedby="mandatory-data-field"
      required
      data-testid="wind-speed-input"
    />
  </div>

  <div class="direction">
    <label for="windDirection">{{ 'field-measuring.shared.wind-direction-label' | transloco }}</label>
    <p-select
      appendTo="body"
      id="windDirection"
      [options]="windDirectionOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="measureData().windDirection"
      (ngModelChange)="onFieldChange('windDirection', $event)"
      styleClass="w-full"
      ariaDescribedBy="mandatory-data-field"
      [required]="true"
      data-testid="wind-direction-select"
    />
  </div>

  <div class="sky">
    <label for="skyCover">{{ 'field-measuring.shared.sky-cover-label' | transloco }}</label>
    <p-select
      appendTo="body"
      id="skyCover"
      [options]="skyCoverOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="measureData().skyCover"
      (ngModelChange)="onFieldChange('skyCover', $event)"
      styleClass="w-full"
      ariaDescribedBy="mandatory-data-field"
      [required]="true"
      data-testid="sky-cover-select"
    />
  </div>
</div>
