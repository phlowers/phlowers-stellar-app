<div class="cac-set-select">
  <div class="cac-set-select__item">
    <p-radiobutton
      name="calculusType"
      value="PAPOTO"
      [ngModel]="selectedCalculusType()"
      (ngModelChange)="onCalculusTypeChange($event)"
      inputId="papoto"
      data-testid="papoto-radio"
    />
    <label for="papoto">{{ 'common.papoto-label' | transloco }}</label>
  </div>

  <div class="cac-set-select__item">
    <p-radiobutton
      name="calculusType"
      value="TANGENT_AIMING_SUPPORT"
      [ngModel]="selectedCalculusType()"
      (ngModelChange)="onCalculusTypeChange($event)"
      inputId="tangentAiming"
      data-testid="tangent-aiming-radio"
    />
    <label for="tangentAiming">{{ 'field-measuring.calculus-setting.tangent-aiming-radio-label' | transloco }}</label>
  </div>

  <div class="cac-set-select__item">
    <p-radiobutton
      name="calculusType"
      value="PEP"
      [ngModel]="selectedCalculusType()"
      (ngModelChange)="selectedCalculusType.set($event)"
      inputId="pep"
      [disabled]="true"
      data-testid="pep-radio"
    />
    <label for="pep">{{ 'common.pep-label' | transloco }}</label>
  </div>
</div>

@if (selectedCalculusType() === 'PAPOTO') {
  <app-papoto [leftSupportOption]="leftSupportOption()" [(measureData)]="measureData" />
}
@if (selectedCalculusType() === 'TANGENT_AIMING_SUPPORT') {
  <app-tangent-aiming-support [(measureData)]="measureData" />
}
@if (selectedCalculusType() === 'PEP') {
  <app-pep />
}
