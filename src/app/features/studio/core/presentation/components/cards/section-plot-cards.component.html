<article
  class="articles collapsible"
  data-testid="cards-article"
  [class.collapsible--collapsed]="arraysOfSupports().length > 3"
>
  @for (support of arraysOfSupports(); track $index) {
    <app-section-plot-card data-testid="support-card" [litData]="litData()" [type]="'support'" [index]="support" />
    @if ($index < arraysOfSupports().length - 1) {
      <app-section-plot-card
        data-testid="span-card"
        [litData]="litData()"
        [type]="'span'"
        [index]="spanIndex($index)"
      />
    }
  }
</article>
