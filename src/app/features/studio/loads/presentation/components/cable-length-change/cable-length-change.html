<form
  [formGroup]="form"
  class="cable-length-change__form"
  [attr.aria-busy]="isLoading()"
  (ngSubmit)="saveForm()"
  data-testid="cable-length-change-form"
>
  <div class="header-btns">
    <button
      app-btn
      type="button"
      btnStyle="outlined"
      btnSize="s"
      (click)="zoomToSpan()"
      [disabled]="isLoading() || !scopeValue()"
      data-testid="cable-length-change-zoom"
    >
      <app-icon icon="filter_center_focus" aria-hidden="true" />
      <ng-container>{{ 'shared.studio.zoom' | transloco }}</ng-container>
    </button>

    <button
      app-btn
      type="button"
      btnStyle="outlined"
      btnSize="s"
      (click)="resetForm()"
      [disabled]="isLoading()"
      data-testid="cable-length-change-reset"
    >
      <app-icon icon="refresh" />
      <ng-container>{{ 'loads.shared.reset-btn' | transloco }}</ng-container>
    </button>
  </div>

  <div>
    <label for="scope">{{ 'loads.shared.span-label' | transloco }}</label>
    <p-select
      inputId="scope"
      [options]="spansOptions()"
      fluid
      formControlName="scope"
      optionLabel="label"
      optionValue="value"
      (onChange)="onScopeChange($event.value)"
      data-testid="cable-length-change-scope"
    />
  </div>

  <div>
    <label for="supportRef">{{ 'loads.shared.reference-support-label' | transloco }}</label>
    <p-select
      inputId="supportRef"
      [options]="supportRefOptions()"
      fluid
      formControlName="supportRef"
      optionLabel="label"
      optionValue="value"
      data-testid="cable-length-change-support-ref"
    />
  </div>

  <div class="col-span-2">
    <label for="modificationType">{{ 'loads.cable-length-change.cable-modification-label' | transloco }}</label>
    <p-select
      inputId="modificationType"
      fluid
      [options]="modificationTypeOptions"
      formControlName="modificationType"
      optionLabel="label"
      optionValue="value"
      data-testid="cable-length-change-width-cable"
    />
  </div>

  <div>
    <label for="modifiedLengthCable">{{ 'loads.cable-length-change.cable-length-mod-label' | transloco }}</label>
    <p-inputgroup>
      <input
        pInputText
        type="number"
        id="modifiedLengthCable"
        fluid
        min="0"
        max="1000"
        step="0.01"
        formControlName="modifiedLengthCable"
        data-testid="cable-length-change-size-cable"
      />
      <p-inputgroup-addon>m</p-inputgroup-addon>
    </p-inputgroup>
  </div>

  <div>
    <label for="distanceSupportRef">{{ 'loads.cable-length-change.dist-to-ref-support-label' | transloco }}</label>
    <p-inputgroup>
      <input
        pInputText
        type="number"
        id="distanceSupportRef"
        fluid
        min="0"
        max="5000"
        step="0.01"
        formControlName="distanceSupportRef"
        data-testid="cable-length-change-distance-support-ref"
      />
      <p-inputgroup-addon>m</p-inputgroup-addon>
    </p-inputgroup>
  </div>

  <div class="cable-length-change__btns">
    <button
      app-btn
      btnStyle="danger"
      type="button"
      [attr.aria-label]="'loads.cable-length-change.delete-aria-label' | transloco"
      (click)="deleteForm()"
      [disabled]="hasSavedModification()"
      data-testid="cable-length-change-delete"
    >
      <app-icon icon="delete" />
    </button>

    <button
      app-btn
      type="submit"
      btnStyle="outlined"
      [disabled]="isFormInvalid() || isLoading() || !isDirtySinceLastSave()"
      [btnLoading]="isLoading()"
      data-testid="cable-length-change-save"
    >
      <app-icon icon="save" />
      <ng-container>{{ 'loads.shared.save-btn' | transloco }}</ng-container>
    </button>

    <button
      app-btn
      [disabled]="isFormInvalid() || isLoading()"
      [btnLoading]="isCalculatingOnly()"
      type="button"
      (click)="calculateCableLength()"
      data-testid="cable-length-change-calculate"
    >
      <app-icon icon="rocket_launch" />
      <ng-container>{{ 'loads.shared.calculate-btn' | transloco }}</ng-container>
    </button>
  </div>

  @if (error()) {
  <div class="cable-length-change__error" role="alert" aria-live="assertive" data-testid="cable-length-change-error">
    {{ error() }}
  </div>
  }
</form>
