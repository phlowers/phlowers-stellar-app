<p-dialog
  dismissableMask="true"
  [visible]="isOpen()"
  (visibleChange)="isOpenChange.emit(false)"
  [style]="{ width: '31rem' }"
  [modal]="true"
>
  <ng-template #header>
    <p class="text-l-600 mb-0 flex gap-2">
      <app-icon icon="add_circle" />
      <span>{{ 'shared.new-charge-modal.create-title' | transloco }}</span>
    </p>
  </ng-template>

  <ng-template #content>
    <form class="flex flex-col gap-3">
      <h3 class="section-title">{{ 'shared.new-charge-modal.generalities' | transloco }}</h3>

      <div>
        <label for="chargeName" class="label">
          <ng-container>{{ 'shared.new-charge-modal.charge-name-label' | transloco }}</ng-container>
          <sup class="mandatory">*</sup>
        </label>
        <input
          type="text"
          pInputText
          id="chargeName"
          name="chargeName"
          maxlength="100"
          [ngModel]="name()"
          (ngModelChange)="updateName($event)"
          [class.ng-invalid]="isNameDuplicate()"
          [attr.aria-invalid]="isNameDuplicate()"
          [attr.aria-errormessage]="isNameDuplicate() ? 'charge-name-error-message' : null"
          required
          fluid
          data-testid="charge-name-input"
        />
        @if (isNameDuplicate()) {
          <p-message
            id="charge-name-error-message"
            severity="error"
            size="small"
            variant="simple"
            data-testid="name-error"
          >
            {{ 'shared.new-charge-modal.charge-name-error' | transloco }}
          </p-message>
        }
      </div>

      <div class="personnel-presence">
        <label for="personnelPresence" class="label">{{
          'shared.new-charge-modal.personnel-presence' | transloco
        }}</label>
        <p-toggleswitch
          inputId="personnelPresence"
          name="personnelPresence"
          [ngModel]="personnelPresence()"
          (onChange)="updatePersonnelPresence($event.checked)"
          data-testid="personnel-toggle"
        />
      </div>

      <div>
        <div class="label-container">
          <label for="description" class="label">{{ 'shared.new-charge-modal.description-label' | transloco }}</label>
          <span class="input-length">{{ descriptionLength() }}/240</span>
        </div>
        <textarea
          id="description"
          name="description"
          [placeholder]="'shared.new-charge-modal.description-placeholder' | transloco"
          class="block"
          pTextarea
          [ngModel]="description()"
          (ngModelChange)="updateDescription($event)"
          maxlength="240"
          rows="3"
          cols="20"
          fluid
          data-testid="description-textarea"
        ></textarea>
      </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <button app-btn type="button" btnSize="m" btnStyle="text" (click)="onClose()" data-testid="close-btn">
      <app-icon icon="close" />
      <ng-container>{{ 'shared.new-charge-modal.close' | transloco }}</ng-container>
    </button>

    <button
      app-btn
      type="button"
      btnSize="m"
      (click)="onSubmit()"
      [disabled]="!isFormValid()"
      data-testid="validate-btn"
    >
      <app-icon icon="check" />
      <ng-container>{{ 'common.actions.validate' | transloco }}</ng-container>
    </button>
  </ng-template>
</p-dialog>
