@if (!btnLoading()) {
  <ng-content select="app-icon:not([iconRight])" />
} @else if (hasLeftIcon()) {
  <app-icon icon="progress_activity" />
}

<span class="app-btn-label">
  <ng-content />
</span>

@if (!btnLoading()) {
  <ng-content select="app-icon[iconRight]" />
} @else if (hasRightIcon()) {
  <app-icon icon="progress_activity" />
}
