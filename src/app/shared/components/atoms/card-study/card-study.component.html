<article>
  <h3 data-testid="card-study-title">
    {{ title() }}
  </h3>

  <dl>
    <dt>
      <app-icon icon="person" />
      <span>{{ 'studies.card-study.author' | transloco }}</span>
    </dt>
    <dd data-testid="card-study-author">
      {{ authorMail() }}
    </dd>

    <dt>
      <app-icon icon="history" />
      <span>{{ 'studies.card-study.last-changed' | transloco }}</span>
    </dt>
    <dd data-testid="card-study-date">
      {{ modificationDate() }}
    </dd>
  </dl>

  @if (tagList()) {
    <ul>
      @for (tag of tagList(); track $index) {
        <li>
          <app-tag [text]="tag.text" [type]="tag.color" />
        </li>
      }
    </ul>
  }

  <button (click)="onCardClick()" data-testid="go-to-study-btn">
    {{ 'studies.card-study.go-to-study' | transloco }} {{ title() }}
  </button>
</article>
