<fieldset
  class="stepper"
  [class.stepper--error]="hasError()"
  [class.stepper--disabled]="disabled()"
  [attr.aria-labelledby]="label() ? inputId + '-label' : null"
>
  @if (label()) {
    <label [id]="inputId + '-label'" class="stepper__label" [for]="inputId">
      {{ label() }}
    </label>
  }

  <div class="stepper__field">
    <input
      [id]="inputId"
      type="number"
      [formControl]="pointsCountControl"
      class="stepper__input"
      data-testid="number-input"
      [attr.min]="min()"
      [attr.max]="max()"
      [placeholder]="placeholder()"
      [attr.aria-errormessage]="assistiveId()"
      [attr.aria-invalid]="hasError()"
      readonly
      (blur)="markTouched()"
    />

    <div class="stepper__controls">
      <span class="stepper__divider" aria-hidden="true"></span>

      <button
        type="button"
        class="stepper__btn"
        [class.stepper__btn--disabled]="disabled() || isAtMin()"
        [disabled]="disabled() || isAtMin()"
        [attr.aria-label]="'Reduce'"
        i18n-aria-label
        data-testid="decrement-btn"
        (click)="decrement()"
      >
        <span class="pi pi-minus" aria-hidden="true"></span>
      </button>

      <span class="stepper__divider" aria-hidden="true"></span>

      <button
        type="button"
        class="stepper__btn"
        [class.stepper__btn--disabled]="disabled() || isAtMax()"
        [disabled]="disabled() || isAtMax()"
        [attr.aria-label]="'Increase'"
        i18n-aria-label
        data-testid="increment-btn"
        (click)="increment()"
      >
        <span class="pi pi-plus" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  @if (displayedAssistiveText()) {
    <p
      [id]="assistiveId()"
      class="stepper__assistive"
      [class.stepper__assistive--error]="hasError()"
      [attr.role]="hasError() ? 'alert' : null"
      [attr.aria-live]="hasError() ? 'assertive' : null"
    >
      {{ displayedAssistiveText() }}
    </p>
  }
</fieldset>
