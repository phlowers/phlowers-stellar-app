<header>
  <p class="text-l-600 mb-0">{{ currentPageTitle() }}</p>

  <p
    class="calculation mb-0"
    [class]="{
      'calculation--ready': workerReady(),
      'calculation--error': workerError()
    }"
    id="topbar-engine"
  >
    <span class="calculation__icon">
      <app-icon icon="calculate" class="calculation__icon__calc" />

      <app-icon
        icon="progress_activity"
        [class.show]="!workerReady() && !workerError()"
        class="calculation__icon__status calculation__icon__status--spinner"
      />
      <app-icon
        icon="check_circle"
        [class.show]="workerReady() && !workerError()"
        class="calculation__icon__status calculation__icon__status--filled"
      />
      <app-icon
        icon="error"
        [class.show]="workerError()"
        class="calculation__icon__status calculation__icon__status--filled"
      ></app-icon>
    </span>

    <span class="calculation__txt" [class.show]="!workerReady() && !workerError()">{{
      'common.loading' | transloco
    }}</span>

    <span class="calculation__txt" [class.show]="workerReady() && !workerError()">{{
      'common.ready' | transloco
    }}</span>

    <span class="calculation__txt" [class.show]="workerError()">{{ 'common.error' | transloco }}</span>
  </p>

  <p
    class="offline-status mb-0"
    [class.offline-status--ready]="offlineKind() === 'ready'"
    [class.offline-status--warning]="offlineWarning()"
    [attr.title]="offlineTooltipKey() ? (offlineTooltipKey()! | transloco) : null"
    role="status"
    aria-live="polite"
    data-testid="offline-status-indicator"
    [attr.data-status]="offlineKind()"
  >
    <app-icon [icon]="offlineIcon()" aria-hidden="true" />
    <span>{{ offlineLabelKey() | transloco }}</span>
  </p>

  <p class="user" data-testid="user-info">{{ user()?.email ?? 'No user' }}</p>
</header>
