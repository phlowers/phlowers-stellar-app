{% if docs_current_language == "fr" %}
{% set other_label = "EN" %}
{% else %}
{% set other_label = "FR" %}
{% endif %}

<div class="pst-navbar-language-switcher">
  <a
    id="language-switcher-link"
    class="nav-link"
    href="#"
    data-current-language="{{ docs_current_language }}"
    data-en-origin="{{ docs_en_origin }}"
    data-fr-origin="{{ docs_fr_origin }}"
    data-en-prefix="{{ docs_en_prefix }}"
    data-fr-prefix="{{ docs_fr_prefix }}"
    aria-label="Switch to {{ other_label }}"
  >
    <span id="language-switcher-label">{{ other_label }}</span>
  </a>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var link = document.getElementById('language-switcher-link');
    var label = document.getElementById('language-switcher-label');
    if (!link || !label) {
      return;
    }

    var current = link.dataset.currentLanguage === 'fr' ? 'fr' : 'en';
    var other = current === 'en' ? 'fr' : 'en';

    var origins = { en: link.dataset.enOrigin || '', fr: link.dataset.frOrigin || '' };
    var prefixes = { en: link.dataset.enPrefix || '', fr: link.dataset.frPrefix || '' };

    var href;
    var segments = window.location.pathname.split('/');

    // Find the LAST exact "en"/"fr" path segment: in production this is our
    // language sub-tree, even when ReadTheDocs prepends its own "/en/<version>/"
    // base (which would be an earlier segment we must leave untouched).
    var langIndex = -1;
    for (var i = 0; i < segments.length; i++) {
      if (segments[i] === 'en' || segments[i] === 'fr') {
        langIndex = i;
      }
    }

    if (langIndex !== -1) {
      // Same origin, swap only the sub-tree language segment.
      segments[langIndex] = other;
      href = segments.join('/') + window.location.hash;
    } else {
      // Dev multi-port: no language segment in the path, jump to the other
      // language's origin/prefix at the same sub-path.
      var subPath = window.location.pathname;
      if (subPath.charAt(0) !== '/') {
        subPath = '/' + subPath;
      }
      href = origins[other] + prefixes[other] + subPath + window.location.hash;
    }

    var otherLabel = other.toUpperCase();
    link.href = href;
    link.setAttribute('aria-label', 'Switch to ' + otherLabel);
    label.textContent = otherLabel;
  });
</script>
