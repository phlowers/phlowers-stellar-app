name: 🐍 Python dev CI

on:
  pull_request:
    paths:
      - 'stellar-engine/**'
  push:
    paths:
      - 'stellar-engine/**'
    branches:
      - main
      - dev
    

jobs:
  manylinux_build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 📃 Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disable shallow clones to improve sonarcloud analysis
          
      - name: ⚙️ cd into stellar-engine
        run: |
          cd stellar-engine

      - name: ⚙️ Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          # Install a specific version of uv.
          version: "0.5.24"
          python-version: ${{ matrix.python-version }}

      - name: ⚙️ Check uv version
        run: |
          uv --version
    
      - name: ⚙️ Install dependencies
        run: |
          uv sync --group all

      - name: ✔️ Check code style
        run: |
          uv run ruff format --check

      - name: ✔️ Lint code
        run: |
          uv run ruff check

      - name: ✔️ Check typing
        run: |
          uv run mypy .

      - name: ✔️ Run tests and generate coverage report
        run: |
          uv run pytest --cov-report xml --cov=stellar_engine

      - name: 🛠️ Build wheel
        run: |
          uv build
