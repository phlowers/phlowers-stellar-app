[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "stellar-engine"
dynamic = ["version"]
description = "Stellar python engine for stellar application"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = "==3.13.*"
authors = [
    {name = "Adrien Goeller"},
    { name = "Jeremy Wang" },
]
keywords = ["stellar", "phlowers", "mechaphlowers"]

dependencies = [
    "annotated-types==0.7.0",
    "flexcache==0.3",
    "flexparser==0.4",
    "mechaphlowers==0.5.3",
    "mypy-extensions==1.1.0",
    "numpy==2.2.5",
    "packaging==24.2",
    "pandas==2.3.1",
    "pandera==0.23.1",
    "pint==0.25",
    "platformdirs==4.3.6",
    "plotly==5.24.1",
    "pydantic==2.10.6",
    "pydantic-core==2.27.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "six==1.17.0",
    "tenacity==9.1.2",
    "typeguard==4.4.4",
    "typing-extensions==4.14.1",
    "typing-inspect==0.9.0",
    "tzdata==2025.2",
    "xxhash==3.5.0"
]


[dependency-groups]
dev = [
    "ruff==0.6.1",
    "mypy==1.11.2",
    "ipython==8.26.0",
    "ipykernel==6.29.5",
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "unittest-xml-reporting==3.2.0",
    "pandas-stubs==2.2.3.241009",
    "scipy<=1.14.1",
    "types-requests==2.32.4.20250611",
    "plotly-stubs==0.0.5",
    "types-pyyaml>=6.0.12.20250915",
]
test = ["pytest==8.3.2", "pytest-cov==5.0.0", "requests==2.32.4"]

all = [
    { include-group = 'dev' },
    { include-group = 'test' },
]


### Tools configuration

[tool.pdm]
version = { source = "file", path = "src/stellar_engine/__init__.py" }
distribution = true

[tool.pdm.resolution]
allow-prereleases = true


[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = 79
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
# Enable the isort rules.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{test,docs,tools}/*" = ["E402"]

[tool.mypy]
exclude = [
    "virtualenv",
    ".venv*",
    "build",
    "dist",
    "site-packages",
    "tests",
    "docs",
    "doc",
    "examples",
    "example",
]

## Test framework

[tool.pytest.ini_options]
junit_family = "xunit2"
filterwarnings = [
    "ignore::DeprecationWarning",
    # Following warning seems to come from an issue in pandera,
    # see https://github.com/unionai-oss/pandera/issues/1845
    'ignore:use `parametric(<base>, <func>)` as a type instead',
]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = ["-s", "-vv", "-m", "not benchmark and not release_test"]
markers = ["unit_test", "integration", "benchmark", "release_test"]


[tool.coverage.run]
source = ['src']
relative_files = true

