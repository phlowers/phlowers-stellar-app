[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "stellar-engine"
dynamic = ["version"]
description = "Stellar python engine for stellar application"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = "==3.13.*"
license = "MPL-2.0"
authors = [
    {name = "Adrien Goeller"},
    {name = "Jeremy Wang"},
]
keywords = ["stellar", "phlowers", "mechaphlowers"]

dependencies = [
    "mechaphlowers==0.13.1",
]

[project.urls]
Repository = "https://github.com/phlowers/phlowers-stellar-app"


[tool.uv]
# Runtime packages are pinned to the versions of the Pyodide distribution (pyodide-lock.json), so
# the precompiled CDN wheels can replace the PyPI ones. These pins drive uv.lock, which is the
# single source of truth (versions + hashes) of the Python packages shipped to the browser.
# Update them together with the `pyodide` version in package.json.
constraint-dependencies = [
    "annotated-types==0.7.0",
    "certifi==2026.1.4",
    "numpy==2.2.5",
    "packaging==26.2",
    "pandas==2.3.3",
    "pandera==0.34.1",
    "platformdirs==4.3.6",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pyproj==3.7.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "six==1.17.0",
    "tenacity==9.2.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2025.3",
    "xxhash==3.5.0",
]


[dependency-groups]
test = ["pytest==9.1.0", "pytest-cov==5.0.0", "requests==2.33.1"]

dev = [
    "ruff==0.6.1",
    "mypy==1.11.2",
    "ipython==9.14.1",
    "pygments>=2.20.0",
    "ipykernel==7.4.0",
    # Force recent version of following lib to avoid CVE:
    # https://github.com/phlowers/phlowers-stellar-app/security/dependabot/191
    # https://github.com/phlowers/phlowers-stellar-app/security/dependabot/193
    # https://github.com/phlowers/phlowers-stellar-app/security/dependabot/190
    "tornado>=6.5.8",
    "unittest-xml-reporting==3.2.0",
    "pandas-stubs==2.2.3.241009",
    "scipy==1.14.1",
    "types-requests==2.33.0.20260518",
    "plotly-stubs==0.0.5",
    "types-pyyaml>=6.0.12.20250915",
    { include-group = 'test' },
]


### Tools configuration

[tool.pdm]
version = { source = "file", path = "src/stellar_engine/__init__.py" }
distribution = true

[tool.pdm.resolution]
allow-prereleases = true


[tool.ruff]
target-version = "py313"
line-length = 79

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = 79
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
# Enable the isort rules.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{test,docs,tools}/*" = ["E402"]

[tool.mypy]
exclude = [
    "virtualenv",
    ".venv*",
    "build",
    "dist",
    "site-packages",
    "tests",
    "docs",
    "doc",
    "examples",
    "example",
]

## Test framework

[tool.pytest.ini_options]
junit_family = "xunit2"
filterwarnings = [
    "ignore::DeprecationWarning",
    # Following warning seems to come from an issue in pandera,
    # see https://github.com/unionai-oss/pandera/issues/1845
    'ignore:use `parametric(<base>, <func>)` as a type instead',
]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = ["-s", "-vv", "-m", "not benchmark and not release_test"]
markers = ["unit_test", "integration", "benchmark", "release_test"]


[tool.coverage.run]
source = ['src']
relative_files = true
